name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Point Gradle at the pre-installed Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat local.properties

      - name: Accept Android SDK licenses & install required components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses || true
          yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build release APK
        run: gradle assembleRelease

      - name: Verify APK exists
        run: ls -la app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd-balance-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AMD Balance ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release-unsigned.apk